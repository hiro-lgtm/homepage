<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#2c3e50" opacity="0.05"/>
  <g transform="translate(32, 32)">
    <!-- 書類とスタンプ -->
    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="#2c3e50" opacity="0.9"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="-8" y1="-4" x2="6" y2="-4" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="4" x2="6" y2="4" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <!-- 承認スタンプ -->
    <circle cx="6" cy="-6" r="4" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <path d="M4,-6 L5.5,-4.5 L8,-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- 円マーク（補助金） -->
    <circle cx="8" cy="8" r="3.5" fill="none" stroke="#2c3e50" stroke-width="2" opacity="0.8"/>
    <path d="M6,8 L8,6 L10,8" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
