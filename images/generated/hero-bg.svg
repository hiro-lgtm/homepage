<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1a1a18"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a2a28" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- Data chart bars -->
  <rect x="80" y="380" width="48" height="140" fill="#2a2a28"/>
  <rect x="148" y="320" width="48" height="200" fill="#2a2a28"/>
  <rect x="216" y="260" width="48" height="260" fill="#3d3d38"/>
  <rect x="284" y="200" width="48" height="320" fill="#3d3d38"/>
  <rect x="352" y="240" width="48" height="280" fill="#b8973a" opacity="0.4"/>
  <rect x="420" y="160" width="48" height="360" fill="#b8973a" opacity="0.6"/>
  <rect x="488" y="120" width="48" height="400" fill="#b8973a" opacity="0.8"/>
  <!-- Rising line -->
  <polyline points="104,400 172,340 240,290 308,230 376,265 444,185 512,145 580,100" fill="none" stroke="#b8973a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on line -->
  <circle cx="104" cy="400" r="4" fill="#b8973a"/>
  <circle cx="240" cy="290" r="4" fill="#b8973a"/>
  <circle cx="376" cy="265" r="4" fill="#b8973a"/>
  <circle cx="512" cy="145" r="6" fill="#b8973a"/>
  <!-- Floating number elements -->
  <text x="580" y="200" font-family="serif" font-size="48" fill="#2a2a28" opacity="0.6" font-weight="700">+</text>
  <text x="620" y="300" font-family="serif" font-size="32" fill="#3d3d38" opacity="0.4">¥</text>
  <text x="640" y="160" font-family="sans-serif" font-size="12" fill="#b8973a" opacity="0.4" letter-spacing="3">MANAGEMENT</text>
  <!-- Horizontal axis -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#2a2a28" stroke-width="1.5"/>
  <!-- Vertical axis -->
  <line x1="60" y1="80" x2="60" y2="520" stroke="#2a2a28" stroke-width="1.5"/>
  <!-- Tick marks -->
  <line x1="56" y1="400" x2="64" y2="400" stroke="#3d3d38" stroke-width="1"/>
  <line x1="56" y1="300" x2="64" y2="300" stroke="#3d3d38" stroke-width="1"/>
  <line x1="56" y1="200" x2="64" y2="200" stroke="#3d3d38" stroke-width="1"/>
  <line x1="56" y1="100" x2="64" y2="100" stroke="#b8973a" stroke-width="1"/>
</svg>
