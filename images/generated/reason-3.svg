<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="360" fill="#f0ece4"/>
  <!-- Three overlapping circles - Venn diagram -->
  <circle cx="240" cy="155" r="110" fill="#d8d4c8" opacity="0.5"/>
  <circle cx="340" cy="155" r="110" fill="#c8c4b8" opacity="0.5"/>
  <circle cx="290" cy="245" r="110" fill="#d0ccbf" opacity="0.5"/>
  <!-- Center intersection -->
  <circle cx="290" cy="185" r="36" fill="#b8973a" opacity="0.25"/>
  <!-- Labels -->
  <text x="180" y="120" font-family="serif" font-size="14" fill="#3d3d38" text-anchor="middle" font-weight="600">経理</text>
  <text x="180" y="138" font-family="sans-serif" font-size="10" fill="#8a8880" text-anchor="middle" letter-spacing="1">ACCOUNTING</text>
  <text x="400" y="120" font-family="serif" font-size="14" fill="#3d3d38" text-anchor="middle" font-weight="600">IT</text>
  <text x="400" y="138" font-family="sans-serif" font-size="10" fill="#8a8880" text-anchor="middle" letter-spacing="1">TECHNOLOGY</text>
  <text x="290" y="300" font-family="serif" font-size="14" fill="#3d3d38" text-anchor="middle" font-weight="600">AI</text>
  <text x="290" y="318" font-family="sans-serif" font-size="10" fill="#8a8880" text-anchor="middle" letter-spacing="1">AUTOMATION</text>
  <!-- Center label -->
  <text x="290" y="181" font-family="serif" font-size="11" fill="#b8973a" text-anchor="middle" font-weight="600">設計</text>
  <text x="290" y="196" font-family="sans-serif" font-size="9" fill="#b8973a" text-anchor="middle" letter-spacing="2">DESIGN</text>
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="3" fill="#d8d4c8"/>
  <circle cx="80" cy="50" r="3" fill="#d8d4c8"/>
  <circle cx="110" cy="50" r="3" fill="#d8d4c8"/>
  <circle cx="50" cy="80" r="3" fill="#d8d4c8"/>
  <circle cx="80" cy="80" r="3" fill="#b8973a" opacity="0.4"/>
  <circle cx="110" cy="80" r="3" fill="#d8d4c8"/>
  <circle cx="490" cy="50" r="3" fill="#d8d4c8"/>
  <circle cx="520" cy="50" r="3" fill="#d8d4c8"/>
  <circle cx="550" cy="50" r="3" fill="#d8d4c8"/>
  <circle cx="490" cy="80" r="3" fill="#d8d4c8"/>
  <circle cx="520" cy="80" r="3" fill="#b8973a" opacity="0.4"/>
  <circle cx="550" cy="80" r="3" fill="#d8d4c8"/>
  <!-- Gold accent line -->
  <line x1="0" y1="355" x2="600" y2="355" stroke="#b8973a" stroke-width="3"/>
</svg>
