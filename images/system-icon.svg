<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#2c3e50" opacity="0.05"/>
  <g transform="translate(32, 32)">
    <!-- システムアーキテクチャ -->
    <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#2c3e50" opacity="0.9"/>
    <!-- システムコンポーネント -->
    <rect x="-12" y="-8" width="8" height="6" rx="1" fill="white" opacity="0.35"/>
    <rect x="-2" y="-8" width="8" height="6" rx="1" fill="white" opacity="0.35"/>
    <rect x="8" y="-8" width="4" height="6" rx="1" fill="white" opacity="0.35"/>
    <rect x="-12" y="0" width="24" height="6" rx="1" fill="white" opacity="0.35"/>
    <!-- 接続線 -->
    <line x1="-4" y1="-5" x2="-2" y2="-5" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="6" y1="-5" x2="8" y2="-5" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-12" y1="-2" x2="-12" y2="0" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-2" x2="0" y2="0" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="-2" x2="10" y2="0" stroke="white" stroke-width="2" opacity="0.6"/>
    <!-- データフローインジケーター -->
    <circle cx="-10" cy="-5" r="1" fill="#2c3e50" opacity="0.6"/>
    <circle cx="0" cy="-5" r="1" fill="#2c3e50" opacity="0.6"/>
    <circle cx="10" cy="-5" r="1" fill="#2c3e50" opacity="0.6"/>
  </g>
</svg>
