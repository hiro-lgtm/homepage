<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#2c3e50" opacity="0.05"/>
  <g transform="translate(32, 32)">
    <!-- 帳簿 -->
    <rect x="-14" y="-10" width="28" height="20" rx="2" fill="#2c3e50" opacity="0.9"/>
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-12" y1="2" x2="12" y2="2" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-12" y1="6" x2="12" y2="6" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <!-- 計算機 -->
    <rect x="8" y="-4" width="6" height="8" rx="1" fill="white" opacity="0.25"/>
    <line x1="9" y1="-2" x2="12" y2="-2" stroke="#2c3e50" stroke-width="1" opacity="0.7"/>
    <line x1="9" y1="0" x2="12" y2="0" stroke="#2c3e50" stroke-width="1" opacity="0.7"/>
    <line x1="9" y1="2" x2="12" y2="2" stroke="#2c3e50" stroke-width="1" opacity="0.7"/>
    <!-- 時計（早期化） -->
    <circle cx="-8" cy="-6" r="3.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="-8" y1="-6" x2="-8" y2="-8.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-8" y1="-6" x2="-6" y2="-6" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
