<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#2c3e50" opacity="0.05"/>
  <g transform="translate(32, 32)">
    <!-- カレンダー -->
    <rect x="-12" y="-10" width="24" height="20" rx="2" fill="#2c3e50" opacity="0.9"/>
    <rect x="-12" y="-10" width="24" height="6" rx="2" fill="#2c3e50" opacity="0.7"/>
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="4" x2="8" y2="4" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <!-- 日付マーカー -->
    <circle cx="-4" cy="-2" r="2" fill="white" opacity="0.4"/>
    <circle cx="4" cy="-2" r="2" fill="white" opacity="0.4"/>
    <!-- 時計（時間管理） -->
    <circle cx="8" cy="-6" r="3.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="8" y1="-6" x2="8" y2="-9" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="-6" x2="10.5" y2="-6" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
