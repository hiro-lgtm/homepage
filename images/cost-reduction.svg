<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#2c3e50" opacity="0.05"/>
  <g transform="translate(32, 32)">
    <!-- グラフ（削減前） -->
    <rect x="-12" y="4" width="3.5" height="8" rx="1.5" fill="#2c3e50" opacity="0.25"/>
    <rect x="-6" y="2" width="3.5" height="10" rx="1.5" fill="#2c3e50" opacity="0.25"/>
    <rect x="0" y="0" width="3.5" height="12" rx="1.5" fill="#2c3e50" opacity="0.25"/>
    <!-- グラフ（削減後） -->
    <rect x="-12" y="8" width="3.5" height="4" rx="1.5" fill="#2c3e50" opacity="0.9"/>
    <rect x="-6" y="6" width="3.5" height="6" rx="1.5" fill="#2c3e50" opacity="0.9"/>
    <rect x="0" y="4" width="3.5" height="8" rx="1.5" fill="#2c3e50" opacity="0.9"/>
    <!-- 下向き矢印（削減） -->
    <path d="M-2,-10 L0,-12 L2,-10" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
    <line x1="0" y1="-12" x2="0" y2="0" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <!-- 円マーク（コスト） -->
    <circle cx="8" cy="-10" r="4.5" fill="none" stroke="#2c3e50" stroke-width="2.5" opacity="0.9"/>
    <path d="M5.5,-10 L8,-7.5 L10.5,-10" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
